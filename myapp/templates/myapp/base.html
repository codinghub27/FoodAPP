<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <nav class="bg-sky-700">
        <div class="flex justify-between px-3 py-6 ">

          <a href="{%url 'myapp:index' %}" class="font-bold text-white text-xl">FoodApp</a>
          <div class="space-x-6">
              <a href="{% url 'profile' %}" class=" text-white text-xl">Welcome {{user.username}} !</a>
            {% if user.is_authenticated %}
              <a class=" text-white text-xl" href="{% url 'logout' %}">Logout</a>
             {% else %}
              <a class=" text-white text-xl " href="{% url 'logout' %}">Logout</a>
              {% endif %}
          </div>

         </div>
    </nav>
    {% if messages %}

    {% for message in messages %}

    <div class="bg-green-500 text-green-700">
                {{message}}

    </div>

    {% endfor %}

    {% endif %}

    {%block body%}


    {% endblock %}

</body>
</html>
